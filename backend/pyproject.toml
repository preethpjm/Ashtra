[project]
name = "asthra"
version = "0.1.0.dev1"
description = "ASTHRA local engineering information platform — backend"
requires-python = ">=3.10"
dependencies = ["lxml>=5.2", "xmlschema>=3.3", "pydantic>=2.6", "fastapi>=0.110",
                "uvicorn>=0.29", "python-multipart>=0.0.9", "networkx>=3.2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
asthra = "asthra.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asthra*"]
